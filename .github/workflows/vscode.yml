name: VS Code extension

# Publishes packages/vscode to the VS Code Marketplace and Open VSX when a vscode-v* tag is pushed
# (the tag must match the version in packages/vscode/package.json).
# Secrets, in the "marketplace" environment: VSCE_PAT (Azure DevOps token, Marketplace › Manage scope) and
# OVSX_PAT (open-vsx.org token). Without OVSX_PAT, Open VSX is skipped. A version already published is skipped too,
# so after adding a token, run this workflow again by hand on the same tag ("Use workflow from" › the tag).
on:
  push:
    tags: ['vscode-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish Estuary for VS Code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: marketplace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The themes match the tokens
        run: npm run check
      - name: The tag matches the extension's version
        run: test "vscode-v$(node -p "require('./packages/vscode/package.json').version")" = "$GITHUB_REF_NAME"
      - name: Package
        working-directory: packages/vscode
        run: npx --yes @vscode/vsce@4.0.0 package --out estuary.vsix
      - name: Publish to the VS Code Marketplace
        working-directory: packages/vscode
        run: npx --yes @vscode/vsce@4.0.0 publish --packagePath estuary.vsix --skip-duplicate
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Publish to Open VSX
        working-directory: packages/vscode
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::notice::OVSX_PAT is not set: Open VSX skipped."
            exit 0
          fi
          publisher=$(node -p "require('./package.json').publisher")
          curl -sf "https://open-vsx.org/api/$publisher" > /dev/null || npx --yes ovsx@1.2.0 create-namespace "$publisher"
          npx --yes ovsx@1.2.0 publish estuary.vsix --skip-duplicate
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
