name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  tokens:
    name: Tokens (generated files, contrast rules, formatting)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - name: The site builds
        run: npm run site
      - name: The npm package builds and packs
        run: npm pack --dry-run

  swift:
    name: Swift package (swift-format, build, tests)
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: xcrun swift-format lint --strict -r Sources Tests Package.swift
      - run: swift test
      - name: The Xcode themes are valid property lists
        run: plutil -lint packages/xcode/*.xccolortheme
